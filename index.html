<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusOS - Dashboard Futurista</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-glow: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --card-hover: rgba(30, 41, 59, 0.8);
            --success: #10b981;
            --warning: #f59e0b;
        }

        [data-theme="cyberpunk"] {
            --bg-color: #050508;
            --panel-bg: rgba(15, 15, 25, 0.8);
            --panel-border: rgba(255, 0, 128, 0.2);
            --text-primary: #fff;
            --text-secondary: #a78bfa;
            --accent-glow: #ff007f;
            --accent-gradient: linear-gradient(135deg, #ff007f 0%, #7928ca 50%, #00dfd8 100%);
            --card-hover: rgba(25, 20, 40, 0.9);
        }

        [data-theme="emerald"] {
            --bg-color: #021a13;
            --panel-bg: rgba(5, 36, 27, 0.7);
            --panel-border: rgba(16, 185, 129, 0.2);
            --text-primary: #ecfdf5;
            --text-secondary: #6ee7b7;
            --accent-glow: #10b981;
            --accent-gradient: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
            --card-hover: rgba(6, 78, 59, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            position: relative;
            transition: background-color 0.5s ease;
        }

        /* Canvas de fondo con partículas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Sidebar Moderno */
        aside {
            width: 280px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        .brand i {
            -webkit-text-fill-color: var(--accent-glow);
            font-size: 1.8rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-links li a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-links li.active a, .nav-links li a:hover {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            transform: translateX(4px);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid var(--panel-border);
        }

        .user-profile img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-glow);
        }

        .user-info h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .user-info p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Contenido Principal */
        main {
            flex-grow: 1;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: calc(100vw - 280px);
            overflow-y: auto;
            z-index: 5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .welcome-box h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .welcome-box p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-selector {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(10px);
            font-weight: 500;
        }

            background
